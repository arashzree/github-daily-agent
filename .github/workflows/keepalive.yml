name: keepalive

# GitHub disables scheduled workflows in public repos after 60 days without
# repository activity. The agent only reads the repo, so a quiet month would
# silently stop the nightly run. Re-enabling the workflows through the API
# once a month resets that timer. This workflow re-enables itself as well,
# since its own schedule is subject to the same rule.
on:
  schedule:
    - cron: "0 6 1 * *"  # 06:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow enable agent.yml
          gh workflow enable keepalive.yml
          gh workflow list --all
