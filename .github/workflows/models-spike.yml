name: models-spike

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Ollama
        run: |
          start=$(date +%s)
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:11434/api/version && break; sleep 1; done
          echo; echo "install+start: $(( $(date +%s) - start ))s"
          nproc; free -h

      - name: Run spike
        run: |
          start=$(date +%s)
          python3 scripts/ollama_spike.py \
            "qwen3.5:9b" \
            "gemma4:e4b"
          echo "total pull+inference: $(( $(date +%s) - start ))s"

      - name: Ollama server log
        if: always()
        run: tail -n 50 ollama.log || true
